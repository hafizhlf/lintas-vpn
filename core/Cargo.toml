[package]
name = "lintas-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "lintas_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
libc = "0.2"
boringtun = { path = "vendor/boringtun", default-features = false }
quiche = { version = "0.22", features = ["boringssl-vendored"] }
octets = "0.3"
ring = "0.17"
anyhow = "1"
pem = "3"
x509-parser = "0.16"

[profile.release]
lto = true
strip = true
panic = "abort"
